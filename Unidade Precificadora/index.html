<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0d0d0d">
  <title>Nitros Bike - Precificação e OS</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg-main: #0d0d0d;
      --bg-card: #181818;
      --bg-input: #222222;
      --border: #2e2e2e;
      --red: #e60000;
      --red-hover: #ff1a1a;
      --red-dim: rgba(230, 0, 0, 0.15);
      --text-main: #ffffff;
      --text-muted: #9e9e9e;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* TOPBAR */
    header {
      background-color: var(--bg-card);
      border-bottom: 2px solid var(--red);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      flex-direction: column;
    }

    .brand h1 {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .brand h1 span {
      color: var(--red);
    }

    .user-badge {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .user-badge strong {
      color: var(--text-main);
    }

    .btn-upload {
      background-color: var(--bg-input);
      color: var(--text-main);
      border: 1px solid var(--red);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-upload:hover {
      background-color: var(--red);
    }

    /* LAYOUT PRINCIPAL */
    .main-container {
      display: grid;
      grid-template-columns: 1fr 430px;
      gap: 16px;
      padding: 16px;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      flex: 1;
    }

    /* COLUNA ESQUERDA: BUSCA E CATÁLOGO */
    .catalog-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .search-box {
      position: relative;
    }

    .search-input {
      width: 100%;
      background-color: var(--bg-card);
      border: 2px solid var(--border);
      color: var(--text-main);
      padding: 14px 40px 14px 16px;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--red);
    }

    .clear-search {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
      display: none;
    }

    /* FILTROS DE CATEGORIA */
    .categories-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .categories-bar::-webkit-scrollbar {
      display: none;
    }

    .cat-pill {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }

    .cat-pill.active {
      background-color: var(--red);
      color: var(--text-main);
      border-color: var(--red);
    }

    /* LISTA DE PRODUTOS */
    .catalog-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .item-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .item-info {
      flex: 1;
    }

    .item-top {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
      flex-wrap: wrap;
    }

    .item-sku {
      font-size: 0.7rem;
      background-color: var(--bg-input);
      color: var(--text-muted);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
    }

    .item-cat {
      font-size: 0.72rem;
      color: var(--red);
      font-weight: 700;
      text-transform: uppercase;
    }

    .item-name {
      font-size: 0.98rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .item-prices {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .item-prices strong {
      color: var(--text-main);
    }

    .item-note {
      margin-top: 6px;
      font-size: 0.76rem;
      color: #ffb74d;
      background: rgba(255, 183, 77, 0.1);
      padding: 4px 8px;
      border-left: 2px solid #ffb74d;
      border-radius: 2px;
    }

    .btn-add {
      background-color: var(--red);
      color: var(--text-main);
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
      transition: 0.2s;
    }

    .btn-add:hover:not(:disabled) {
      background-color: var(--red-hover);
    }

    .btn-add:disabled {
      background-color: var(--bg-input);
      color: var(--text-muted);
      border: 1px solid var(--border);
      cursor: not-allowed;
    }

    /* COLUNA DIREITA: CARRINHO */
    .cart-section {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      height: fit-content;
      position: sticky;
      top: 72px;
    }

    .section-title {
      font-size: 1rem;
      font-weight: 700;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* SELETOR ORDEM DE SERVIÇO VS SERVIÇO RÁPIDO */
    .service-type-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background-color: var(--bg-main);
      padding: 4px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .type-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 10px 8px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .type-btn.active {
      background-color: var(--red);
      color: var(--text-main);
    }

    .edit-sr-num {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 0.72rem;
      cursor: pointer;
    }

    /* ITENS DO CARRINHO */
    .cart-items {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 340px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .cart-empty {
      text-align: center;
      color: var(--text-muted);
      padding: 28px 10px;
      font-size: 0.9rem;
    }

    .cart-item {
      background-color: var(--bg-main);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .cart-item-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .cart-item-name {
      font-size: 0.9rem;
      font-weight: 600;
    }

    .cart-item-subtotal {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
    }

    .cart-item-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .qty-control {
      display: flex;
      align-items: center;
      gap: 8px;
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px 6px;
    }

    .qty-btn {
      background: none;
      border: none;
      color: var(--red);
      font-size: 1.1rem;
      font-weight: 800;
      width: 24px;
      height: 24px;
      cursor: pointer;
    }

    .qty-val {
      font-size: 0.88rem;
      font-weight: 700;
      min-width: 18px;
      text-align: center;
    }

    .labor-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: var(--text-main);
      cursor: pointer;
      user-select: none;
      background-color: var(--bg-card);
      padding: 5px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    .labor-toggle input {
      accent-color: var(--red);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .btn-remove-item {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.78rem;
      cursor: pointer;
      text-decoration: underline;
    }

    .btn-remove-item:hover {
      color: var(--red);
    }

    /* MODIFICAR VALOR (DESCONTO / ACRÉSCIMO) */
    .mod-toggle-btn {
      background-color: var(--bg-input);
      border: 1px dashed var(--border);
      color: var(--text-muted);
      padding: 9px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }

    .mod-toggle-btn.active {
      border-color: var(--red);
      color: var(--text-main);
      background-color: var(--red-dim);
    }

    .mod-box {
      display: none;
      flex-direction: column;
      gap: 8px;
      background-color: var(--bg-main);
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .mod-box.show {
      display: flex;
    }

    .mod-type-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .mod-type-btn {
      padding: 7px;
      border-radius: 5px;
      border: 1px solid var(--border);
      background-color: var(--bg-card);
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    .mod-type-btn.active {
      background-color: var(--red);
      color: var(--text-main);
      border-color: var(--red);
    }

    .mod-inputs {
      display: grid;
      grid-template-columns: 1fr 110px;
      gap: 8px;
    }

    .input-sm {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
      width: 100%;
    }

    .input-sm:focus {
      border-color: var(--red);
    }

    /* PAGAMENTO */
    .payment-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }

    .pay-btn {
      background-color: var(--bg-main);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 9px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }

    .pay-btn.active {
      border-color: var(--red);
      background-color: var(--red-dim);
      color: var(--text-main);
    }

    /* TOTAL E BOTÃO FINALIZAR */
    .cart-footer {
      border-top: 1px solid var(--border);
      padding-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.15rem;
      font-weight: 800;
    }

    .total-val {
      color: var(--red);
      font-size: 1.35rem;
    }

    .btn-finalize {
      background-color: var(--red);
      color: var(--text-main);
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 800;
      text-transform: uppercase;
      cursor: pointer;
      letter-spacing: 0.5px;
    }

    .btn-finalize:hover {
      background-color: var(--red-hover);
    }

    /* CAIXA DE TEXTO GERADO */
    .output-box {
      display: none;
      flex-direction: column;
      gap: 10px;
      background-color: var(--bg-main);
      border: 2px solid var(--red);
      border-radius: 8px;
      padding: 12px;
      margin-top: 4px;
    }

    .output-box.show {
      display: flex;
    }

    .output-text {
      font-size: 0.85rem;
      line-height: 1.4;
      color: var(--text-main);
      background-color: var(--bg-card);
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      word-break: break-word;
      user-select: all;
    }

    .output-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn-copy {
      background-color: var(--bg-input);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
    }

    .btn-complete {
      background-color: var(--success);
      color: #000;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: 800;
      font-size: 0.82rem;
      cursor: pointer;
    }

    /* MODAL PRIMEIRO ACESSO (NOME DO ATENDENTE) */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.92);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999;
      padding: 16px;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal-card {
      background-color: var(--bg-card);
      border: 2px solid var(--red);
      border-radius: 10px;
      padding: 24px;
      max-width: 400px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .modal-card h2 {
      font-size: 1.2rem;
    }

    .modal-card p {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* BARRA INFERIOR MOBILE */
    .mobile-nav {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: var(--bg-card);
      border-top: 2px solid var(--red);
      grid-template-columns: 1fr 1fr;
      z-index: 150;
    }

    .mob-tab {
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 14px 10px;
      font-size: 0.9rem;
      font-weight: 800;
      cursor: pointer;
    }

    .mob-tab.active {
      background-color: var(--red);
      color: var(--text-main);
    }

    /* RESPONSIVIDADE CELULAR */
    @media (max-width: 899px) {
      body {
        padding-bottom: 60px;
      }
      .main-container {
        grid-template-columns: 1fr;
        padding: 12px;
      }
      .cart-section {
        position: static;
        display: none;
      }
      .cart-section.mob-active {
        display: flex;
      }
      .catalog-section.mob-hidden {
        display: none;
      }
      .mobile-nav {
        display: grid;
      }
    }
  </style>
</head>
<body>

  <!-- MODAL DE IDENTIFICAÇÃO PERMANENTE -->
  <div id="userModal" class="modal-overlay">
    <div class="modal-card">
      <h2>Identificação do Atendente</h2>
      <p>Digite seu nome. Ele ficará salvo permanentemente neste aparelho e sairá no final de todos os resumos de serviço.</p>
      <input type="text" id="userNameInput" class="search-input" placeholder="Ex: Jean" autocomplete="off">
      <button id="saveUserBtn" class="btn-finalize">Salvar Permanentemente</button>
    </div>
  </div>

  <!-- TOPO -->
  <header>
    <div class="brand">
      <h1>NITROS <span>BIKE</span></h1>
      <div class="user-badge">Atendente: <strong id="displayUserName">---</strong></div>
    </div>
    <div>
      <input type="file" id="jsonFileInput" accept=".json" style="display: none;">
      <button class="btn-upload" onclick="document.getElementById('jsonFileInput').click()">
        📂 Inserir Valores
      </button>
    </div>
  </header>

  <!-- CONTEÚDO PRINCIPAL -->
  <div class="main-container">
    
    <!-- COLUNA 1: BUSCA E CATÁLOGO -->
    <section id="catalogView" class="catalog-section">
      <div class="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="Pesquisar peça, serviço ou código (Ex: Aro, Motor, Cabecote)...">
        <button id="clearSearchBtn" class="clear-search" title="Limpar">✕</button>
      </div>

      <div id="categoriesBar" class="categories-bar"></div>

      <div id="catalogList" class="catalog-list"></div>
    </section>

    <!-- COLUNA 2: CARRINHO E FINALIZAÇÃO -->
    <section id="cartView" class="cart-section">
      <div class="section-title">
        <span>Resumo do Atendimento</span>
        <button class="btn-remove-item" onclick="clearCart()">Limpar tudo</button>
      </div>

      <!-- SELETOR TIPO DE SERVIÇO -->
      <div class="service-type-toggle">
        <button id="btnTypeOS" class="type-btn active" onclick="setServiceType('OS')">
          Ordem de Serviço
        </button>
        <button id="btnTypeSR" class="type-btn" onclick="setServiceType('SR')">
          <span>Serviço Rápido #<span id="srCounterDisplay">001</span></span>
          <span class="edit-sr-num" onclick="editSrCounter(event)" title="Ajustar numeração">✎</span>
        </button>
      </div>

      <!-- LISTA DO CARRINHO -->
      <div id="cartItemsList" class="cart-items"></div>

      <!-- DESCONTO / ACRÉSCIMO -->
      <button id="modToggleBtn" class="mod-toggle-btn" onclick="toggleModificationBox()">
        + Modificar Valor (Desconto / Acréscimo)
      </button>

      <div id="modBox" class="mod-box">
        <div class="mod-type-row">
          <button id="btnModDiscount" class="mod-type-btn active" onclick="setModType('discount')">- Desconto</button>
          <button id="btnModSurcharge" class="mod-type-btn" onclick="setModType('surcharge')">+ Acréscimo</button>
        </div>
        <div class="mod-inputs">
          <input type="text" id="modReason" class="input-sm" placeholder="Motivo (Ex: Desconto à vista)" oninput="updateCartUI()">
          <input type="number" id="modValue" class="input-sm" placeholder="Valor R$" min="0" step="0.50" oninput="updateCartUI()">
        </div>
      </div>

      <!-- FORMA DE PAGAMENTO -->
      <div>
        <div style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 6px; font-weight: 600;">Forma de Pagamento:</div>
        <div class="payment-grid">
          <button class="pay-btn active" onclick="setPayment('Pix', this)">Pix</button>
          <button class="pay-btn" onclick="setPayment('Dinheiro', this)">Dinheiro</button>
          <button class="pay-btn" onclick="setPayment('Cartão de Débito', this)">Cartão Débito</button>
          <button class="pay-btn" onclick="setPayment('Cartão de Crédito', this)">Cartão Crédito</button>
        </div>
      </div>

      <!-- RODAPÉ E BOTÃO FINALIZAR -->
      <div class="cart-footer">
        <div class="total-row">
          <span>Total:</span>
          <span id="cartTotalDisplay" class="total-val">R$ 0,00</span>
        </div>
        <button class="btn-finalize" onclick="generateSummaryText()">Finalizar e Gerar Texto</button>

        <!-- SAÍDA EM LINHA ÚNICA -->
        <div id="outputBox" class="output-box">
          <div style="font-size: 0.78rem; color: var(--text-muted); font-weight: 700;">Descrição detalhada (linha única):</div>
          <div id="outputText" class="output-text"></div>
          <div class="output-actions">
            <button class="btn-copy" onclick="copyOnly()">📋 Só Copiar</button>
            <button class="btn-complete" onclick="copyAndFinish()">✅ Copiar e Novo</button>
          </div>
        </div>
      </div>
    </section>
  </div>

  <!-- BARRA MOBILE -->
  <nav class="mobile-nav">
    <button id="mobTabCatalog" class="mob-tab active" onclick="switchMobileTab('catalog')">
      🔍 Catálogo
    </button>
    <button id="mobTabCart" class="mob-tab" onclick="switchMobileTab('cart')">
      🛒 Carrinho (<span id="mobCartCount">0</span>)
    </button>
  </nav>

  <script>
    // CHAVES DO ARMAZENAMENTO PERSISTENTE (SEPARADAS)
    const KEY_USER = 'nitros_usuario';
    const KEY_CATALOG = 'nitros_catalogo';
    const KEY_SR_COUNTER = 'nitros_contador_sr';

    // ESTADO DO APP
    let catalog = [];
    let cart = []; // [{ sku, qty, includeLabor }]
    let activeCategory = 'Todos';
    let serviceType = 'OS'; // 'OS' ou 'SR'
    let modActive = false;
    let modType = 'discount'; // 'discount' ou 'surcharge'
    let paymentMethod = 'Pix';

    // INICIALIZAÇÃO
    window.addEventListener('DOMContentLoaded', () => {
      checkUserIdentity();
      loadSrCounter();
      loadCatalogFromStorage();
      setupSearchEvents();

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      }
    });

    // 1. IDENTIFICAÇÃO PERMANENTE DO USUÁRIO
    function checkUserIdentity() {
      const savedUser = localStorage.getItem(KEY_USER);
      const modal = document.getElementById('userModal');
      const display = document.getElementById('displayUserName');

      if (!savedUser || savedUser.trim() === '') {
        modal.classList.add('show');
        document.getElementById('saveUserBtn').onclick = () => {
          const val = document.getElementById('userNameInput').value.trim();
          if (!val) {
            alert('Por favor, digite seu nome para continuar.');
            return;
          }
          localStorage.setItem(KEY_USER, val);
          display.textContent = val;
          modal.classList.remove('show');
        };
      } else {
        display.textContent = savedUser;
      }
    }

    // 2. CONTADOR PERSISTENTE DO SERVIÇO RÁPIDO
    function getSrCounter() {
      let num = parseInt(localStorage.getItem(KEY_SR_COUNTER), 10);
      if (isNaN(num) || num < 1) {
        num = 1;
        localStorage.setItem(KEY_SR_COUNTER, num);
      }
      return num;
    }

    function loadSrCounter() {
      const num = getSrCounter();
      document.getElementById('srCounterDisplay').textContent = String(num).padStart(3, '0');
    }

    function editSrCounter(e) {
      e.stopPropagation();
      const current = getSrCounter();
      const input = prompt('Digite o número atual para o Serviço Rápido:', current);
      if (input !== null) {
        const parsed = parseInt(input, 10);
        if (!isNaN(parsed) && parsed > 0) {
          localStorage.setItem(KEY_SR_COUNTER, parsed);
          loadSrCounter();
          hideOutputBox();
        }
      }
    }

    // 3. IMPORTAÇÃO E ARMAZENAMENTO DO CATÁLOGO (SUBSTITUIÇÃO TOTAL)
    function loadCatalogFromStorage() {
      const saved = localStorage.getItem(KEY_CATALOG);
      if (saved) {
        try {
          catalog = JSON.parse(saved);
        } catch (e) {
          catalog = [];
        }
      }
      renderCategories();
      renderCatalog();
      updateCartUI();
    }

    document.getElementById('jsonFileInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const json = JSON.parse(evt.target.result);
          const newItems = Array.isArray(json) ? json : (json.catalog || []);

          if (!Array.isArray(newItems) || newItems.length === 0) {
            alert('Formato de arquivo inválido. Verifique se o JSON contém a lista "catalog".');
            return;
          }

          // Esquece completamente o catálogo anterior e grava apenas o novo
          localStorage.removeItem(KEY_CATALOG);
          localStorage.setItem(KEY_CATALOG, JSON.stringify(newItems));

          catalog = newItems;
          cart = [];
          activeCategory = 'Todos';
          renderCategories();
          renderCatalog();
          updateCartUI();
          alert(`Catálogo atualizado com sucesso! (${newItems.length} itens carregados)`);
        } catch (err) {
          alert('Erro ao ler o arquivo JSON. Verifique se o documento está correto.');
        }
        e.target.value = '';
      };
      reader.readAsText(file);
    });

    // 4. BUSCA E FILTROS
    function normalizeStr(str) {
      return (str || '').toString().normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    }

    function setupSearchEvents() {
      const input = document.getElementById('searchInput');
      const clearBtn = document.getElementById('clearSearchBtn');

      input.addEventListener('input', () => {
        clearBtn.style.display = input.value.length > 0 ? 'block' : 'none';
        renderCatalog();
      });

      clearBtn.addEventListener('click', () => {
        input.value = '';
        clearBtn.style.display = 'none';
        renderCatalog();
        input.focus();
      });
    }

    function renderCategories() {
      const bar = document.getElementById('categoriesBar');
      const cats = ['Todos', ...new Set(catalog.map(i => i.category).filter(Boolean))];
      bar.innerHTML = cats.map(c => `
        <button class="cat-pill ${c === activeCategory ? 'active' : ''}" onclick="selectCategory('${c}')">
          ${c}
        </button>
      `).join('');
    }

    function selectCategory(cat) {
      activeCategory = cat;
      renderCategories();
      renderCatalog();
    }

    function formatBRL(val) {
      return Number(val || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function renderCatalog() {
      const list = document.getElementById('catalogList');
      const query = normalizeStr(document.getElementById('searchInput').value.trim());

      if (catalog.length === 0) {
        list.innerHTML = `
          <div class="cart-empty" style="background: var(--bg-card); border-radius: 8px; border: 1px dashed var(--border);">
            Nenhum catálogo carregado.<br><br>
            Clique no botão <strong>"📂 Inserir Valores"</strong> no topo direito e selecione o arquivo <code>nitros_bike_catalogo.json</code>.
          </div>`;
        return;
      }

      const filtered = catalog.filter(item => {
        const matchCat = activeCategory === 'Todos' || item.category === activeCategory;
        if (!matchCat) return false;
        if (!query) return true;
        const target = normalizeStr(`${item.name} ${item.category} ${item.sku} ${item.notes}`);
        return target.includes(query);
      });

      if (filtered.length === 0) {
        list.innerHTML = `<div class="cart-empty">Nenhum item encontrado para essa busca.</div>`;
        return;
      }

      list.innerHTML = filtered.map(item => {
        const inCart = cart.some(c => c.sku === item.sku);
        let priceDesc = '';

        if (item.type === 'part_labor') {
          priceDesc = `Peça: <strong>${formatBRL(item.price_part)}</strong> | M.O.: <strong>${formatBRL(item.price_labor)}</strong> (Total: ${formatBRL(item.price_total)})`;
        } else if (item.type === 'labor_only') {
          priceDesc = `Mão de Obra: <strong>${formatBRL(item.price_labor || item.price_total)}</strong>`;
        } else {
          priceDesc = `Valor: <strong>${formatBRL(item.price_total || item.price_part)}</strong>`;
        }

        return `
          <div class="item-card">
            <div class="item-info">
              <div class="item-top">
                <span class="item-sku">${item.sku}</span>
                <span class="item-cat">${item.category}</span>
              </div>
              <div class="item-name">${item.name}</div>
              <div class="item-prices">${priceDesc}</div>
              ${item.notes ? `<div class="item-note">⚠️ ${item.notes}</div>` : ''}
            </div>
            <button class="btn-add" ${inCart ? 'disabled' : ''} onclick="addToCart('${item.sku}')">
              ${inCart ? 'No Carrinho' : '+ Adicionar'}
            </button>
          </div>
        `;
      }).join('');
    }

    // 5. LÓGICA DO CARRINHO
    function addToCart(sku) {
      if (cart.some(c => c.sku === sku)) return; // Bloqueia duplicidade pela busca
      const item = catalog.find(i => i.sku === sku);
      if (!item) return;

      cart.push({
        sku: item.sku,
        qty: 1,
        includeLabor: false // Escolha manual do usuário no carrinho
      });

      hideOutputBox();
      renderCatalog();
      updateCartUI();
    }

    function changeQty(sku, delta) {
      const idx = cart.findIndex(c => c.sku === sku);
      if (idx === -1) return;

      cart[idx].qty += delta;
      if (cart[idx].qty <= 0) {
        cart.splice(idx, 1);
      }
      hideOutputBox();
      renderCatalog();
      updateCartUI();
    }

    function toggleItemLabor(sku, checked) {
      const found = cart.find(c => c.sku === sku);
      if (found) {
        found.includeLabor = checked;
        hideOutputBox();
        updateCartUI();
      }
    }

    function removeFromCart(sku) {
      cart = cart.filter(c => c.sku !== sku);
      hideOutputBox();
      renderCatalog();
      updateCartUI();
    }

    function clearCart() {
      if (cart.length === 0) return;
      cart = [];
      modActive = false;
      document.getElementById('modBox').classList.remove('show');
      document.getElementById('modToggleBtn').classList.remove('active');
      document.getElementById('modReason').value = '';
      document.getElementById('modValue').value = '';
      hideOutputBox();
      renderCatalog();
      updateCartUI();
    }

    function setServiceType(type) {
      serviceType = type;
      document.getElementById('btnTypeOS').classList.toggle('active', type === 'OS');
      document.getElementById('btnTypeSR').classList.toggle('active', type === 'SR');
      hideOutputBox();
    }

    function toggleModificationBox() {
      modActive = !modActive;
      document.getElementById('modBox').classList.toggle('show', modActive);
      document.getElementById('modToggleBtn').classList.toggle('active', modActive);
      if (!modActive) {
        document.getElementById('modReason').value = '';
        document.getElementById('modValue').value = '';
      }
      hideOutputBox();
      updateCartUI();
    }

    function setModType(type) {
      modType = type;
      document.getElementById('btnModDiscount').classList.toggle('active', type === 'discount');
      document.getElementById('btnModSurcharge').classList.toggle('active', type === 'surcharge');
      hideOutputBox();
      updateCartUI();
    }

    function setPayment(method, btnEl) {
      paymentMethod = method;
      document.querySelectorAll('.pay-btn').forEach(b => b.classList.remove('active'));
      btnEl.classList.add('active');
      hideOutputBox();
    }

    function getUnitPrice(catalogItem, includeLabor) {
      if (catalogItem.type === 'labor_only') {
        return Number(catalogItem.price_labor || catalogItem.price_total || 0);
      }
      if (catalogItem.type === 'part_labor') {
        const part = Number(catalogItem.price_part || 0);
        const labor = includeLabor ? Number(catalogItem.price_labor || 0) : 0;
        return part + labor;
      }
      return Number(catalogItem.price_total || catalogItem.price_part || 0);
    }

    function calculateTotals() {
      let itemsSubtotal = 0;
      cart.forEach(c => {
        const item = catalog.find(i => i.sku === c.sku);
        if (!item) return;
        itemsSubtotal += getUnitPrice(item, c.includeLabor) * c.qty;
      });

      let modVal = 0;
      if (modActive) {
        const raw = parseFloat(document.getElementById('modValue').value);
        if (!isNaN(raw) && raw > 0) {
          modVal = modType === 'discount' ? -raw : raw;
        }
      }

      const finalTotal = Math.max(0, itemsSubtotal + modVal);
      return { itemsSubtotal, modVal, finalTotal };
    }

    function updateCartUI() {
      const container = document.getElementById('cartItemsList');
      const totalItemsCount = cart.reduce((acc, c) => acc + c.qty, 0);
      document.getElementById('mobCartCount').textContent = totalItemsCount;

      if (cart.length === 0) {
        container.innerHTML = `<div class="cart-empty">O carrinho está vazio.<br>Pesquise e adicione itens ao lado.</div>`;
      } else {
        container.innerHTML = cart.map(c => {
          const item = catalog.find(i => i.sku === c.sku);
          if (!item) return '';
          const unitPrice = getUnitPrice(item, c.includeLabor);
          const itemSub = unitPrice * c.qty;

          return `
            <div class="cart-item">
              <div class="cart-item-header">
                <div class="cart-item-name">${item.name}</div>
                <div class="cart-item-subtotal">${formatBRL(itemSub)}</div>
              </div>
              <div class="cart-item-controls">
                <div class="qty-control">
                  <button class="qty-btn" onclick="changeQty('${item.sku}', -1)">−</button>
                  <span class="qty-val">${c.qty}</span>
                  <button class="qty-btn" onclick="changeQty('${item.sku}', 1)">+</button>
                </div>

                ${item.type === 'part_labor' ? `
                  <label class="labor-toggle">
                    <input type="checkbox" ${c.includeLabor ? 'checked' : ''} onchange="toggleItemLabor('${item.sku}', this.checked)">
                    <span>+ M.O. (${formatBRL(item.price_labor)})</span>
                  </label>
                ` : `
                  <span style="font-size: 0.76rem; color: var(--text-muted);">
                    ${item.type === 'labor_only' ? 'Só Mão de Obra' : 'Valor fechado'}
                  </span>
                `}

                <button class="btn-remove-item" onclick="removeFromCart('${item.sku}')">Remover</button>
              </div>
            </div>
          `;
        }).join('');
      }

      const { finalTotal } = calculateTotals();
      document.getElementById('cartTotalDisplay').textContent = formatBRL(finalTotal);
    }

    // 6. GERAÇÃO DO TEXTO EM LINHA ÚNICA
    function generateSummaryText() {
      if (cart.length === 0) {
        alert('Adicione pelo menos um item no carrinho antes de finalizar.');
        return;
      }

      const attendant = localStorage.getItem(KEY_USER) || 'Atendente';
      const srNum = String(getSrCounter()).padStart(3, '0');
      const headerLabel = serviceType === 'SR' ? `Serviço Rápido #${srNum}` : `Ordem de Serviço`;

      const itemsStrings = cart.map(c => {
        const item = catalog.find(i => i.sku === c.sku);
        const sub = getUnitPrice(item, c.includeLabor) * c.qty;
        let laborTag = '';
        if (item.type === 'part_labor') {
          laborTag = c.includeLabor ? ' c/ M.O.' : ' s/ M.O.';
        }
        return `${c.qty}x ${item.name}${laborTag} (${formatBRL(sub)})`;
      });

      const { modVal, finalTotal } = calculateTotals();
      let modSegment = '';

      if (modActive && modVal !== 0) {
        const reason = document.getElementById('modReason').value.trim() || 'Ajuste manual';
        const sign = modVal < 0 ? '-' : '+';
        const label = modVal < 0 ? 'Desconto' : 'Acréscimo';
        modSegment = ` | ${label} (${reason}): ${sign}${formatBRL(Math.abs(modVal))}`;
      }

      // Garante texto 100% em uma linha só, sem quebras (\n)
      const singleLine = `${headerLabel} - Itens: ${itemsStrings.join(', ')}${modSegment} | Total: ${formatBRL(finalTotal)} | Pagamento: ${paymentMethod} | Atendente: ${attendant}`
        .replace(/[\r\n]+/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();

      const outBox = document.getElementById('outputBox');
      const outText = document.getElementById('outputText');
      outText.textContent = singleLine;
      outBox.classList.add('show');
    }

    function hideOutputBox() {
      document.getElementById('outputBox').classList.remove('show');
    }

    function copyTextToClipboard(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text);
      } else {
        const temp = document.createElement('textarea');
        temp.value = text;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand('copy');
        document.body.removeChild(temp);
      }
    }

    function copyOnly() {
      const text = document.getElementById('outputText').textContent;
      if (!text) return;
      copyTextToClipboard(text);
      alert('Texto copiado para a área de transferência!');
    }

    function copyAndFinish() {
      const text = document.getElementById('outputText').textContent;
      if (!text) return;
      copyTextToClipboard(text);

      // Se for Serviço Rápido, incrementa a numeração persistente para o próximo cliente
      if (serviceType === 'SR') {
        const nextNum = getSrCounter() + 1;
        localStorage.setItem(KEY_SR_COUNTER, nextNum);
        loadSrCounter();
      }

      clearCart();
      alert('Texto copiado e atendimento concluído! Pronto para o próximo.');
      switchMobileTab('catalog');
    }

    // NAVEGAÇÃO MOBILE
    function switchMobileTab(tab) {
      const catView = document.getElementById('catalogView');
      const cartView = document.getElementById('cartView');
      const btnCat = document.getElementById('mobTabCatalog');
      const btnCart = document.getElementById('mobTabCart');

      if (tab === 'cart') {
        catView.classList.add('mob-hidden');
        cartView.classList.add('mob-active');
        btnCat.classList.remove('active');
        btnCart.classList.add('active');
      } else {
        catView.classList.remove('mob-hidden');
        cartView.classList.remove('mob-active');
        btnCat.classList.add('active');
        btnCart.classList.remove('active');
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
</body>
